name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and publish static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Validate built site (routes, assets, links)
        run: pnpm validate:links

      # Publishes dist/ to the gh-pages branch, which GitHub Pages serves
      # ("Deploy from a branch"). Branch-based publishing is used because
      # creating a Pages site with the Actions artifact flow requires
      # repository administration rights the workflow token does not have;
      # this route is fully self-contained with the default GITHUB_TOKEN.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: build from ${{ github.sha }}"
